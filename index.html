<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Azərbaycanca</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E2229">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Azərbaycanca">

<style>
  :root{--ground:#0E2229;--surface:#15323B;--edge:#20454F;--text:#EDF3F2;
        --mute:#789BA3;--accent:#E8B23A;--warm:#D6455B;--ok:#4FB58B}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ground);color:var(--text)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
       -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  #app{max-width:440px;margin:0 auto;padding:20px 18px 24px}
  .az{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:500;line-height:1.28}
  .tricky{border-bottom:2px dotted var(--accent);padding-bottom:1px;cursor:pointer}
  .tr{color:var(--accent)} .mute{color:var(--mute)}
  .head{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:22px}
  button{font-family:inherit;color:var(--text);cursor:pointer}
  .btn{display:block;width:100%;text-align:center;border:1px solid var(--edge);background:none;
       border-radius:10px;padding:13px 14px;font-size:15px;margin-bottom:8px}
  .btn.gold{border-color:var(--accent);color:var(--accent)}
  .btn.left{text-align:left} .btn.ok{border-color:var(--ok)}
  .btn.bad{border-color:var(--warm)} .btn.dim{color:var(--mute)}
  .play{border:1px solid var(--edge);background:none;color:var(--accent);border-radius:999px;
        width:38px;height:38px;font-size:15px;flex:0 0 auto;padding:0}
  .play.big{width:54px;height:54px;font-size:21px}
  .row{display:flex;gap:14px;align-items:flex-start}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{background:var(--surface);border-radius:12px;padding:14px 16px}
  .note{border-left:2px solid var(--warm);padding-left:14px;font-size:14.5px;line-height:1.6;margin:0 0 18px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px}
  .tile{border:1px solid var(--edge);background:none;border-radius:8px;padding:9px 13px}
  .tile.filled{border:none;background:var(--surface)}
  .drop{min-height:58px;border:1px solid var(--edge);border-radius:10px;padding:12px;
        display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
  .drop.ok{border-color:var(--ok)} .drop.bad{border-color:var(--warm)}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--ground);border-top:1px solid var(--edge);
      display:flex;max-width:440px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:none;background:none;color:var(--mute);padding:15px 0 17px;font-size:14px}
  nav button.on{color:var(--accent)}
  .sheet{position:fixed;inset:0;background:rgba(5,16,20,.74);display:flex;align-items:flex-end;
         justify-content:center;z-index:50}
  .sheet>div{background:var(--surface);border-radius:16px 16px 0 0;
             padding:22px 20px calc(30px + env(safe-area-inset-bottom));width:100%;max-width:440px}
  .seg{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .seg button{flex:1 1 40%;border:1px solid var(--edge);background:none;border-radius:10px;
              padding:9px 4px;font-size:14px;color:var(--mute)}
  .seg button.on{border-color:var(--accent);color:var(--accent)}
  .item{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--edge)}
  h2{font-size:21px;font-weight:500;margin:6px 0 6px}
  .big{font-size:40px;font-weight:300;line-height:1}
  .stat{display:flex;gap:28px;margin:24px 0 28px}
  .stat small{display:block;color:var(--mute);font-size:13px;margin-top:6px}
  .pill{display:inline-block;background:var(--surface);border-radius:999px;
        padding:4px 11px;font-size:12.5px;color:var(--mute);margin-bottom:10px}
</style>
</head>
<body>

<script>
/* ═══════ звуки ═══════ */
var TRICKY={
 "ə":"Короткое «а» из английского cat — рот открыт шире, чем на «э», язык плоский. Самая частая буква языка.",
 "ı":"Глубже русского «ы»: язык оттянут назад, губы расслаблены. Ни одно слово с неё не начинается.",
 "ö":"Как немецкое ö в Köln. Язык ставишь на «э», губы складываешь трубочкой на «о» — и язык больше не двигаешь.",
 "ü":"Как немецкое ü. Язык на «и», губы трубочкой на «у». Выходит «ю» без начального «й».",
 "ğ":"Звонкий горловой звук, как g в голландском gaan. Произносится всегда — не путай с турецким ğ, который молчит. С неё, как и с ı, слова не начинаются."
};

/* ═══════ транскрипция ═══════ */
var AZ_V="aeəıioöuü";
var L={a:"а",b:"б",c:"дж","ç":"ч",d:"д",e:"е","ə":"æ",f:"ф",g:"г","ğ":"г",h:"х",x:"х","ı":"ы",
 i:"и",j:"ж",k:"к",q:"г",l:"л",m:"м",n:"н",o:"о","ö":"ё",p:"п",r:"р",s:"с","ş":"ш",t:"т",
 u:"у","ü":"ю",v:"в",y:"й",z:"з"};
var FINAL={b:"п",d:"т",c:"ч",g:"к",q:"х",z:"с"};
var YOTA={a:"я",u:"ю",o:"ё",e:"е","ə":"йæ",i:"йи","ı":"йы","ö":"йё","ü":"йю"};
var RU_V="аеэёиыоуюæя";
var STRESS_FIX={professor:1,doktor:0,avtobus:1,menyu:0,taksi:0,metro:0,manat:0,hotel:0};

function ruWord(raw){
  var w=raw.toLowerCase(); var out="";
  for(var n=0;n<w.length;n++){
    var ch=w[n],nx=w[n+1],last=n===w.length-1;
    if(ch==="y"&&nx&&AZ_V.indexOf(nx)>=0){out+=YOTA[nx];n++;continue}
    if(ch==="e"&&n===0){out+="э";continue}
    if(last&&FINAL[ch]){out+=FINAL[ch];continue}
    out+=(L[ch]!==undefined?L[ch]:ch);
  }
  var pos=[];for(var k=0;k<out.length;k++){if(RU_V.indexOf(out[k])>=0)pos.push(k)}
  if(pos.length>1){
    var fx=STRESS_FIX[w];
    var p=(fx!==undefined&&pos[fx]!==undefined)?pos[fx]:pos[pos.length-1];
    out=out.slice(0,p+1)+"́"+out.slice(p+1);
  }
  return out;
}
function ruTr(t){return String(t||"").replace(/[a-zA-ZəğışçöüİŞÇÖÜƏĞ]+/g,ruWord)}
function toTurkish(t){return String(t||"").replace(/ə/g,"e").replace(/Ə/g,"E")
  .replace(/x/g,"h").replace(/X/g,"H").replace(/ğ/g,"g").replace(/q/g,"g").replace(/Q/g,"G")}

/* ═══════ контент ═══════ */
function F(before,after,task,options,answer,gloss){return {before:before,after:after,task:task,options:options,answer:answer,gloss:gloss}}

/* ═══════ повторение ═══════ */
var STEPS=[1,3,7,16,35];
function day(){return Math.floor(Date.now()/864e5)}
var S={sched:{},streak:0,lastDay:null,doneBlocks:[],voiceURI:null};
function save(){try{localStorage.setItem("az.v2",JSON.stringify(S))}catch(e){}}
function load(){
  try{var r=JSON.parse(localStorage.getItem("az.v2"));if(r)for(var k in r)S[k]=r[k]}catch(e){}
  var d=day();
  if(S.lastDay!==d){
    if(S.lastDay===null)S.streak=1;
    else if(S.lastDay===d-1)S.streak=(S.streak||0)+1;
    else S.streak=1;
    S.lastDay=d;save();
  }
}
function grade(id,right){
  var c=S.sched[id]||{step:-1};
  var step=right?Math.min(c.step+1,STEPS.length-1):0;
  S.sched[id]={step:step,due:day()+STEPS[step]};save();
}
function dueIds(){var r=[];for(var i=0;i<ALL.length;i++){var p=ALL[i];if(S.sched[p.id]&&S.sched[p.id].due<=day())r.push(p.id)}return r}
function learned(){var n=0;for(var i=0;i<ALL.length;i++)if(S.sched[ALL[i].id])n++;return n}
function nextBlock(){for(var n=0;n<BLOCKS.length;n++)if(S.doneBlocks.indexOf(n)<0)return n;return null}

/* ═══════ озвучка ═══════
   Три режима. az — голос читает оригинал. tr — турецкая переделка.
   ru — русский голос читает нашу транскрипцию, грубо, но узнаваемо. */
function voices(){try{return speechSynthesis.getVoices()||[]}catch(e){return []}}
function langOf(v){return (v.lang||"").toLowerCase().replace("_","-")}
function modeFor(v){
  var l=langOf(v);
  if(l.indexOf("az")===0)return "az";
  if(l.indexOf("tr")===0)return "tr";
  if(l.indexOf("ru")===0)return "ru";
  return "tr";
}
function resolveVoice(){
  var list=voices();
  if(!list.length)return {voice:null,mode:"none"};
  if(S.voiceURI){
    for(var i=0;i<list.length;i++)if(list[i].voiceURI===S.voiceURI)return {voice:list[i],mode:modeFor(list[i])};
  }
  for(var i=0;i<list.length;i++)if(langOf(list[i]).indexOf("az")===0)return {voice:list[i],mode:"az"};
  for(var i=0;i<list.length;i++)if(langOf(list[i]).indexOf("tr")===0)return {voice:list[i],mode:"tr"};
  for(var i=0;i<list.length;i++)if(langOf(list[i]).indexOf("ru")===0)return {voice:list[i],mode:"ru"};
  return {voice:null,mode:"none"};
}
function forVoice(t,mode){
  if(mode==="az")return t;
  if(mode==="ru")return ruTr(t).replace(/́/g,"").replace(/æ/g,"э");
  return toTurkish(t);
}
if(typeof speechSynthesis!=="undefined"&&speechSynthesis.addEventListener){
  speechSynthesis.addEventListener("voiceschanged",function(){
    if(V.tab==="ref"&&V.ref==="voice")render();
  });
}
function say(t){
  try{
    speechSynthesis.cancel();
    var r=resolveVoice();
    var u=new SpeechSynthesisUtterance(forVoice(t,r.mode));
    u.rate=.85;
    if(r.voice){u.voice=r.voice;u.lang=r.voice.lang}else u.lang="tr-TR";
    speechSynthesis.speak(u);
  }catch(e){}
}

/* если запись есть — играем её, нет — отдаём синтезатору */
var missing={};
function playKey(key,text){
  if(!key||missing[key])return say(text);
  try{
    var a=new Audio("audio/"+key+".mp3");
    a.play()["catch"](function(){missing[key]=1;say(text)});
    a.onerror=function(){missing[key]=1;say(text)};
  }catch(e){say(text)}
}

/* ═══════ helpers ═══════ */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function az(t,size,weight){
  var inner=[];
  var chars=String(t).split("");
  for(var i=0;i<chars.length;i++){
    var ch=chars[i],k=ch.toLowerCase();
    inner.push(TRICKY[k]?'<span class="tricky" data-letter="'+k+'">'+esc(ch)+'</span>':esc(ch));
  }
  return '<span class="az" style="font-size:'+size+'px;font-weight:'+(weight||500)+'">'+inner.join("")+'</span>';
}
function play(t,key,b){
  return '<button class="play'+(b?" big":"")+'" data-say="'+esc(t)+'"'+
    (key?' data-audio="'+esc(key)+'"':'')+' aria-label="Прослушать">&#9834;</button>';
}
function shuffle(a){return a.map(function(v){return [Math.random(),v]}).sort(function(x,y){return x[0]-y[0]}).map(function(v){return v[1]})}
function plural(n,a,b,c){var m=n%100,k=n%10;return (m>=11&&m<=14)?c:(k===1?a:((k>=2&&k<=4)?b:c))}

var HIST_KEY=null, historyInited=false, suppressPush=false;
function navSnapshot(){return {tab:V.tab,mode:V.mode,reviewBlk:V.reviewBlk,sheet:V.sheet}}
function pushNav(){
  var snap=navSnapshot(), key=JSON.stringify(snap);
  if(suppressPush){HIST_KEY=key;return}
  if(key===HIST_KEY)return;
  HIST_KEY=key;
  if(!historyInited){historyInited=true;history.replaceState(snap,"")}
  else history.pushState(snap,"");
}
window.addEventListener("popstate",function(e){
  if(V.tab==="today"&&V.mode==="quiz"&&V.quiz.length&&V.qi>0&&V.qi<V.quiz.length){
    if(!confirm("Прогресс в этом занятии не сохранится. Выйти назад?")){
      var snap=navSnapshot();HIST_KEY=JSON.stringify(snap);history.pushState(snap,"");return;
    }
  }
  suppressPush=true;
  var st=e.state;
  if(st){V.tab=st.tab;V.mode=st.mode;V.reviewBlk=st.reviewBlk;V.sheet=st.sheet}
  else{V.tab="today";V.mode="home";V.sheet=null}
  render();
  suppressPush=false;
});

function makeQuestion(p,isNew){
  var types=[];
  if(p.frame)types.push("slot");
  if(p.az.split(/\s+/).length>=3)types.push("assemble");
  types.push("listen");
  if(!isNew)types.push("speak");
  var type=types[Math.floor(Math.random()*types.length)];
  if(type==="listen"){
    var pool=[];for(var i=0;i<ALL.length;i++)if(ALL[i].ru!==p.ru)pool.push(ALL[i].ru);
    var opts=shuffle([p.ru].concat(shuffle(pool).slice(0,3)));
    return {type:type,p:p,options:opts,correct:opts.indexOf(p.ru)};
  }
  if(type==="assemble"){
    var w=p.az.replace(/[,?!.]/g,"").split(/\s+/);
    return {type:type,p:p,correct:w,words:shuffle(w.slice())};
  }
  if(type==="slot")return {type:type,p:p,correct:p.frame.options.indexOf(p.frame.answer)};
  return {type:type,p:p};
}
function startSession(){
  var nb=nextBlock();
  var due=shuffle(dueIds()).slice(0,8);
  V.blk=nb;V.li=0;V.scene=false;V.qi=0;V.score=0;V.picked=null;V.built=[];V.shown=false;
  var items=[];
  if(nb!==null){var bp=BLOCKS[nb].phrases;for(var i=0;i<bp.length;i++)items.push(makeQuestion(bp[i],true))}
  for(var i=0;i<due.length;i++)items.push(makeQuestion(byId(due[i]),false));
  V.quiz=shuffle(items);
  V.mode=(nb!==null)?"learn":"quiz";
  if(!V.quiz.length)V.mode="home";
  render();
}

  f.options.forEach(function(o,n){var c="btn";
    if(V.picked!==null)c+=(n===q.correct?" ok":(n===V.picked?" bad":""));
    h+='<button class="'+c+'" data-pick="'+n+'">'+az(o,17,400)+'</button>'});
  h+='</div>';
  if(V.picked!==null)h+='<div class="row" style="align-items:center;margin-top:20px">'+
    play((f.before||"")+f.answer+(f.after||""),null)+'<span class="mute" style="font-size:14px">'+esc(f.gloss)+'</span></div>'+
    '<button class="btn gold" style="margin-top:18px" data-next="'+(V.picked===q.correct?1:0)+'">Дальше</button>';
  return h;
}

function viewLessons(){
  var curIdx=nextBlock();
  var h='<h2>Уроки</h2><p class="mute" style="font-size:14px;margin:0 0 18px;line-height:1.5">'+
   'Пройденные блоки можно открыть заново — без теста и без влияния на повторения.</p>';
  BLOCKS.forEach(function(b,i){
    var done=S.doneBlocks.indexOf(i)>=0;
    var cur=(!done)&&i===curIdx;
    var locked=!done&&!cur;
    var right;
    if(done)right='<span class="tr" style="font-size:13px">Повторить</span>';
    else if(cur)right='<span class="mute" style="font-size:13px">→ сегодня</span>';
    else right='<span class="mute" style="font-size:17px">🔒</span>';
    h+='<div class="item" style="justify-content:space-between;cursor:pointer;'+(locked?"opacity:.45":"")+'"'+
      (done?' data-act="reviewblock" data-blk="'+i+'"':(cur?' data-act="gotoday"':''))+'>'+
      '<div><div style="font-size:15.5px">'+esc(b.title)+'</div>'+
      '<div class="mute" style="font-size:12.5px;margin-top:2px">'+b.phrases.length+' '+plural(b.phrases.length,"фраза","фразы","фраз")+'</div></div>'+
      right+'</div>';
  });
  return h;
}

function viewLessonReview(){
  var b=BLOCKS[V.reviewBlk],c=b.phrases[V.reviewLi];
  var h='<div class="head"><span>'+esc(b.title)+' · повтор</span><span>'+(V.reviewLi+1)+' из '+b.phrases.length+'</span></div>';
  h+='<div class="row">'+play(c.az,c.id)+'<div style="min-width:0">'+az(c.az,26)+
     '<div class="tr" style="font-size:15px;margin-top:7px">'+esc(ruTr(c.az))+'</div></div></div>';
  h+='<div style="font-size:19px;margin:18px 0 4px">'+esc(c.ru)+'</div>'+
     '<div class="mute" style="font-size:12.5px;margin-bottom:16px">'+esc(c.kind)+'</div>'+
     '<p class="note">'+esc(c.note)+'</p>';
  if(!V.reviewScene)h+='<button class="btn" data-act="reviewscene">Показать сценку</button>';
  else{
    h+='<div class="card"><div class="mute" style="font-size:12.5px;margin-bottom:12px">'+esc(c.scene.who)+'</div>';
    ["a","b"].forEach(function(k){
      h+='<div class="row" style="margin-bottom:'+(k==="a"?13:0)+'px">'+play(c.scene[k],c.id+"-"+k)+
        '<div style="min-width:0">'+az(c.scene[k],17,400)+
        '<div class="tr" style="font-size:13.5px;margin-top:3px">'+esc(ruTr(c.scene[k]))+'</div>'+
        '<div class="mute" style="font-size:14px;margin-top:3px">'+esc(c.scene[k+"Ru"])+'</div></div></div>';
    });
    h+='</div>';
  }
  h+='<div class="grid2" style="margin-top:18px">'+
     '<button class="btn dim" data-act="reviewexit">К списку</button>'+
     '<button class="btn gold" data-act="reviewnext">'+(V.reviewLi+1<b.phrases.length?"Дальше":"Готово")+'</button></div>';
  return h;
}

function viewRun(){
  var h='<h2>Перед выходом</h2><p class="mute" style="font-size:14px;margin:0 0 18px;line-height:1.5">'+
   'Без оценок и интервалов. Слушаешь, повторяешь вслух, идёшь.</p>';
  BLOCKS.forEach(function(b){
    h+='<div style="margin-bottom:20px"><div class="mute" style="font-size:13px;margin-bottom:4px">'+esc(b.title)+'</div>';
    b.phrases.forEach(function(p){h+='<div class="item">'+play(p.az,p.id)+'<div style="min-width:0">'+az(p.az,17)+
      '<div class="tr" style="font-size:13.5px;margin-top:2px">'+esc(ruTr(p.az))+'</div>'+
      '<div class="mute" style="font-size:13.5px">'+esc(p.ru)+'</div></div></div>'});
    h+='</div>';
  });
  return h;
}

function viewVoice(){
  var list=voices(),cur=resolveVoice();
  var MODES={az:"читает азербайджанский как есть",
             tr:"турецкий голос, текст переделывается под него",
             ru:"русский голос читает нашу транскрипцию",
             none:"голосов не найдено"};
  var h='<p class="mute" style="font-size:14px;margin:0 0 16px;line-height:1.55">'+
   'Голоса берутся из системы, а не из приложения, поэтому набор зависит от браузера и телефона. '+
   'Здесь ровно то, что видит этот браузер.</p>';
  h+='<div class="card" style="margin-bottom:18px"><div style="font-size:15px;margin-bottom:4px">'+
   (cur.voice?esc(cur.voice.name):"голос не выбран")+'</div>'+
   '<div class="mute" style="font-size:13.5px">'+MODES[cur.mode]+'</div></div>';
  if(!list.length){
    h+='<p class="mute" style="font-size:14px;line-height:1.6">Браузер пока не отдал список. '+
     'Нажми любую кнопку ♪ и вернись сюда — обычно после первого запуска голоса появляются.</p>';
    return h;
  }
  function rank(v){var l=langOf(v);return l.indexOf("az")===0?0:(l.indexOf("tr")===0?1:(l.indexOf("ru")===0?2:3))}
  var sorted=list.slice().sort(function(a,b){return rank(a)-rank(b)||langOf(a).localeCompare(langOf(b))});
  h+='<div class="mute" style="font-size:13px;margin-bottom:6px">найдено голосов: '+list.length+'</div>';
  sorted.forEach(function(v){
    var on=cur.voice&&cur.voice.voiceURI===v.voiceURI;
    var r=rank(v);
    h+='<div class="item" style="justify-content:space-between">'+
      '<div style="min-width:0;flex:1">'+
      '<div style="font-size:14.5px;color:'+(r<3?"var(--text)":"var(--mute)")+'">'+esc(v.name)+
      (on?' <span class="tr">· выбран</span>':'')+'</div>'+
      '<div class="mute" style="font-size:12.5px;margin-top:2px">'+esc(v.lang)+
      (r===0?" · азербайджанский":(r===1?" · турецкий":(r===2?" · русский":"")))+'</div></div>'+
      '<button class="play" data-testvoice="'+esc(v.voiceURI)+'" aria-label="Проверить">&#9834;</button>'+
      '<button class="tile" data-usevoice="'+esc(v.voiceURI)+'" style="font-size:13px;padding:7px 10px">Взять</button></div>';
  });
  if(S.voiceURI)h+='<button class="btn dim" style="margin-top:16px" data-act="autovoice">Выбрать автоматически</button>';
  h+='<p class="mute" style="font-size:12.5px;margin-top:22px;text-align:center">сборка 5 · 25 сентября</p>';
  return h;
}

function viewRef(){
  var h='<div class="seg">'+
   '<button data-ref="sounds" class="'+(V.ref==="sounds"?"on":"")+'">Звуки</button>'+
   '<button data-ref="harmony" class="'+(V.ref==="harmony"?"on":"")+'">Гармония</button>'+
   '<button data-ref="frames" class="'+(V.ref==="frames"?"on":"")+'">Каркасы</button>'+
   '<button data-ref="voice" class="'+(V.ref==="voice"?"on":"")+'">Голос</button></div>';
  if(V.ref==="voice")return h+viewVoice();

  if(V.ref==="sounds"){
    h+='<p class="mute" style="font-size:14px;margin:0 0 20px;line-height:1.55">'+
     'Русская запись эти пять передать не может — только рот.</p>';
    var keys=Object.keys(TRICKY);
    keys.forEach(function(k,n){
      h+='<div style="display:flex;gap:16px;padding:16px 0;'+(n?"border-top:1px solid var(--edge)":"")+'">'+
      '<div style="width:34px;flex:0 0 auto">'+az(k,30)+'</div>'+
      '<p style="margin:0;font-size:14.5px;line-height:1.55">'+esc(TRICKY[k])+'</p></div>';
    });
    h+='<div class="card mute" style="margin-top:20px;font-size:14px;line-height:1.55">'+
     'Чего транскрипция не покажет: x и h обе пишутся как «х», хотя это разные звуки — x жёсткий, '+
     'как в «ухо», h лёгкий, как выдох. И на конце слова звонкие оглушаются: kitab звучит '+
     'как «китап», papaq — как «папах».</div>';
    return h;
  }
  if(V.ref==="harmony"){
    h+='<p style="font-size:14.5px;line-height:1.6;margin:0 0 20px">'+
     'Гласные корня решают, какой суффикс к нему прилипнет. Смотришь на последнюю гласную — остальное следует за ней.</p>';
    [["Задний ряд","a, ı, o, u","-da","-ım / -um","var(--warm)"],
     ["Передний ряд","e, ə, i, ö, ü","-də","-im / -üm","var(--accent)"]].forEach(function(r){
      h+='<div style="border-left:2px solid '+r[4]+';padding-left:14px;margin-bottom:20px">'+
      '<div style="font-size:15px;margin-bottom:6px">'+r[0]+'</div>'+
      '<div style="color:'+r[4]+';margin-bottom:8px">'+az(r[1],19)+'</div>'+
      '<div class="mute" style="font-size:14px">где — '+r[2]+' · мой — '+r[3]+'</div></div>';
    });
    h+='<p class="mute" style="font-size:14px;line-height:1.6">'+
     'Между -ım и -um выбираешь по огублению: после o и u идёт -um, после a и ı — -ım. '+
     'С передним рядом так же: после ö и ü — -üm, после e, ə, i — -im.</p>'+
     '<div class="card" style="margin-top:18px;line-height:2">'+
     az("ev → evim, evdə",16)+'<br>'+az("kitab → kitabım, kitabda",16)+'<br>'+az("göz → gözüm, gözdə",16)+'</div>';
    return h;
  }
  h+='<p class="mute" style="font-size:14px;margin:0 0 18px;line-height:1.55">'+
   'Каркас — фраза с дыркой. Выучиваешь раз, дальше подставляешь любое слово.</p>';
  ALL.filter(function(p){return p.frame}).forEach(function(p){
    h+='<div style="padding:13px 0;border-top:1px solid var(--edge)">'+
    az((p.frame.before||"")+"…"+(p.frame.after||""),18)+
    '<div class="mute" style="font-size:13.5px;margin-top:5px">'+esc(p.frame.options.join(", "))+'</div></div>';
  });
  h+='<p class="mute" style="font-size:14px;line-height:1.6;margin-top:18px">'+
   'Ударение почти всегда на последнем слоге и переезжает на конец вместе с суффиксом. '+
   'Заимствования вроде professor его не отдают — такие слова запоминаются отдельно.</p>';
  return h;
}

/* ═══════ отрисовка ═══════ */
function render(){
  var a=document.getElementById("app");
  if(V.tab==="today")a.innerHTML=(V.mode==="home")?viewHome():((V.mode==="learn")?viewLearn():viewQuiz());
  else if(V.tab==="run")a.innerHTML=viewRun();
  else if(V.tab==="lessons")a.innerHTML=(V.reviewBlk!==null)?viewLessonReview():viewLessons();
  else a.innerHTML=viewRef();
  document.getElementById("nav").innerHTML=[["today","Сегодня"],["run","Прогон"],["lessons","Уроки"],["ref","Справочник"]]
    .map(function(x){return '<button data-tab="'+x[0]+'" class="'+(V.tab===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("");
  var old=document.getElementById("sheet");if(old)old.parentNode.removeChild(old);
  if(V.sheet){
    var d=document.createElement("div");d.className="sheet";d.id="sheet";
    d.innerHTML='<div>'+az(V.sheet,40)+
      '<p style="font-size:15.5px;line-height:1.6;margin:12px 0 20px">'+esc(TRICKY[V.sheet])+'</p>'+
      '<button class="btn dim" data-act="closesheet">Понятно</button></div>';
    document.body.appendChild(d);
  }
  pushNav();
}

/* ═══════ события ═══════ */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-say],[data-tab],[data-act],[data-pick],[data-next],[data-build],[data-unbuild],[data-ref],[data-letter],[data-testvoice],[data-usevoice]");
  if(!t)return;var d=t.dataset;
  if(d.say!==undefined){playKey(d.audio,d.say);return}
  if(d.testvoice!==undefined){
    var list=voices(),v=null;for(var i=0;i<list.length;i++)if(list[i].voiceURI===d.testvoice)v=list[i];
    if(v){try{speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(forVoice("Çox sağ olun",modeFor(v)));
      u.voice=v;u.lang=v.lang;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
    return}
  if(d.usevoice!==undefined){S.voiceURI=d.usevoice;save();render();return}
  if(d.act==="autovoice"){S.voiceURI=null;save();render();return}
  if(d.letter!==undefined){V.sheet=d.letter;render();return}
  if(d.act==="closesheet"){V.sheet=null;render();return}
  if(d.tab){V.tab=d.tab;V.sheet=null;render();return}
  if(d.ref){V.ref=d.ref;render();return}
  if(d.act==="tab-run"){V.tab="run";render();return}
  if(d.act==="home"){V.tab="today";V.mode="home";render();return}
  if(d.act==="gotoday"){V.tab="today";render();return}
  if(d.act==="reviewblock"){V.reviewBlk=+d.blk;V.reviewLi=0;V.reviewScene=false;render();return}
  if(d.act==="reviewscene"){V.reviewScene=true;render();return}
  if(d.act==="reviewexit"){V.reviewBlk=null;render();return}
  if(d.act==="reviewnext"){
    var rb=BLOCKS[V.reviewBlk];
    if(V.reviewLi+1<rb.phrases.length){V.reviewLi++;V.reviewScene=false}
    else V.reviewBlk=null;
    render();return}
  if(d.act==="start"){startSession();return}
  if(d.act==="reset"){
    if(confirm("Стереть весь прогресс и начать сначала?")){
      S={sched:{},streak:1,lastDay:day(),doneBlocks:[],voiceURI:S.voiceURI};save();V.mode="home";render()}
    return}
  if(d.act==="scene"){V.scene=true;render();return}
  if(d.act==="lnext"){
    var b=BLOCKS[V.blk];
    if(V.li+1<b.phrases.length){V.li++;V.scene=false}
    else{if(S.doneBlocks.indexOf(V.blk)<0){S.doneBlocks.push(V.blk);save()}V.mode="quiz"}
    render();return}
  if(d.act==="reveal"){V.shown=true;render();return}
  if(d.pick!==undefined&&V.picked===null){V.picked=+d.pick;render();return}
  if(d.build!==undefined){V.built.push(d.build);render();return}
  if(d.unbuild!==undefined){V.built.splice(+d.unbuild,1);render();return}
  if(d.next!==undefined){
    var q=V.quiz[V.qi];grade(q.p.id,d.next==="1");
    if(d.next==="1")V.score++;
    V.qi++;V.picked=null;V.built=[];V.shown=false;render();return}
});

load();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")["catch"](function(){});
</script>
</body>
</html>
